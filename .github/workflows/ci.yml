name: test

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        compiler: [g++]

    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev libgmock-dev lcov g++

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=Debug
          cmake --build build

      - name: Run Tests
        run: ./build/tests/tests
        
      - name: Generate Coverage
        run: |
          lcov --capture --directory build --output-file coverage.info --rc lcov_branch_coverage=1 --ignore-errors mismatch,unused
          lcov --remove coverage.info '/usr/*' '*/tests/*' '*/build/*' --output-file coverage_final.info --ignore-errors mismatch,unused

      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage_final.info
